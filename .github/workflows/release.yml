name: Release

on:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'Myra-Security-GmbH/eu-captcha-crowdsec'

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -ldflags="-s -w -X main.version=${{ github.event.release.tag_name }}" \
            -o "cs-eucaptcha-bouncer-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" \
            ./cmd/cs-eucaptcha-bouncer

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: cs-eucaptcha-bouncer-*
